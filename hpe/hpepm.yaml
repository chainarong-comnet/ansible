      rescue:
        - name: record error - show memory
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show memory',
              'error': memory.msg | default('command failed')
            } ] }}"

    - block:
        - name: show fan
          comware_command:
            command: ['show fan']
            type: show
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
