- hosts: all
  serial: 1
  gather_facts: no
  connection: local

  tasks:
    - name: Init failed_tasks list
      set_fact:
        failed_tasks: []

    - block:
        - name: show clock
          comware_command:
            command: ['show clock']
            type: show
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
          register: clock

      rescue:
        - name: record error - show clock
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show clock',
              'error': clock.msg | default('command failed')
            } ] }}"

    - block:
        - name: show config
          comware_command:
            command: ['show current-conf']
            type: show
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
          register: config

      rescue:
        - name: record error - show config
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show config',
              'error': config.msg | default('command failed')
            } ] }}"

    - block:
        - name: show serial number
          comware_command:
            command: ['show device manuinfo']
            type: show
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
          register: serial

      rescue:
        - name: record error - show serial number
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show serial',
              'error': serial.msg | default('command failed')
            } ] }}"

    - block:
        - name: show IP MGMT
          comware_command:
            command: ['show ip interface Vlan-interface 10']
            type: show
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
          register: mgmt

      rescue:
        - name: record error - show IP MGMT
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show IP MGMT',
              'error': mgmt.msg | default('command failed')
            } ] }}"

    - block:
