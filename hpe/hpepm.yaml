              'error': vlan.msg | default('command failed')
            } ] }}"

    - block:
        - name: show lldp neighbors
          comware_neighbors:
            username: "{{ username }}"
            password: "{{ password }}"
            hostname: "{{ ansible_host }}"
          register: lldp

      rescue:
        - name: record error - lldp neighbors
          set_fact:
            failed_tasks: "{{ failed_tasks + [ {
              'host': inventory_hostname,
              'task': 'show lldp',
              'error': lldp.msg | default('command failed')
            } ] }}"
            
    - name: Generate Report
      template:
         src: hpereportedit.j2
         dest: "/ansible/hpe/report/text/{{inventory_hostname}}-config.txt"
      ignore_errors: true 
      
    - name: Generate error log per host
      copy:
        content: |
          {% for task in failed_tasks %}
          Host: {{ task.host }}
          Task: {{ task.task }}
          Error: {{ task.error }}
          -------------------------
          {% endfor %}
        dest: "/ansible/hpe/log/{{ inventory_hostname }}-log-failed.txt"
      when: failed_tasks | length > 0
